name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-lint:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      
      - name: Run ESLint
        working-directory: frontend
        run: npx eslint .
  
  frontend-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3
   
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
   
      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Install test dependencies
        working-directory: frontend
        run: npm install --save-dev jest @vue/test-utils vue-jest@next babel-jest jest-environment-jsdom@28 --legacy-peer-deps


      - name: Run Jest tests
        working-directory: frontend
        run: npm run test:unit

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    #needs: frontend-test
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true
          
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-
      
      - name: Build Docker image
        run: |
          docker build -t frontend-app -f frontend/Dockerfile frontend/
